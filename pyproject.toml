[project]
dynamic = ["version"]
name = "proface-vtk-post"
description = "ProFACE to VTK postprocessor"
readme = "README.md"
authors = [
    { name = "Stefano Miccoli", email = "stefano.miccoli@polimi.it" }
]
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.15.1",
    "meshio>=5.3.5",
    "numpy>=2.3.4",
    "tyro>=0.9.35",
]
license = "MIT"

[project.scripts]
proface-vtu = "proface.vtk.postprocessor.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]

#
# hatch
#
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"
local_scheme = "node-and-date"
[tool.hatch.build.hooks.vcs]
version-file = "src/proface/vtk/postprocessor/_version.py"
[tool.hatch.build.targets.wheel]
packages = ["src/proface"]

#
# ruff
#
[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["A", "ANN", "E", "EM", "F", "I", "NPY", "RUF", "S", "SIM", "TRY", "T10", "UP"]
ignore = ["S101"]

#
# mypy
#
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
module = ["proface.vtk.postprocessor._version"]
ignore_missing_imports = true
